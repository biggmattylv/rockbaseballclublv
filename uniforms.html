<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uniform Packages | Red Rock Baseball Club</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Impact&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0a0c;
            --bg-module: #121216;
            --bg-input: #08080a;
            --red-accent: #d3122a;
            --red-glow: rgba(211, 18, 42, 0.4);
            --text-light: #ffffff;
            --text-muted: #9a9ab0;
            --border-thin: 1px solid #23232c;
            --radius-module: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Impact', sans-serif;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
            text-decoration: none;
        }

        .logo span {
            color: var(--red-accent);
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            margin-left: 1.5rem;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }

        nav a:hover, nav a.active {
            color: var(--red-accent);
        }

        main {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
        }

        .hero-card {
            background-color: var(--bg-module);
            border: var(--border-thin);
            border-top: 4px solid var(--red-accent);
            border-radius: var(--radius-module);
            padding: 4rem 2rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .hero-card h1 {
            font-family: 'Impact', sans-serif;
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 3rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .coming-soon-box {
            background: linear-gradient(145deg, #18181f 0%, #0a0a0c 100%);
            border: 2px dashed var(--red-accent);
            border-radius: var(--radius-module);
            padding: 3.5rem 2rem;
            margin: 0 auto;
            max-width: 600px;
            position: relative;
            overflow: hidden;
        }

        .coming-soon-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, var(--red-glow) 0%, transparent 70%);
            opacity: 0.3;
            pointer-events: none;
        }

        .coming-soon-title {
            font-family: 'Impact', sans-serif;
            font-size: 4rem;
            color: var(--red-accent);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px var(--red-glow);
            line-height: 1;
            margin-bottom: 1rem;
        }

        .coming-soon-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
        }

        .btn-back {
            display: inline-block;
            margin-top: 2.5rem;
            background-color: #202028;
            color: var(--text-light);
            border: var(--border-thin);
            padding: 0.85rem 1.75rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background-color: #2c2c38;
            border-color: var(--red-accent);
            color: #fff;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: var(--border-thin);
            margin-top: 3rem;
        }

        @media (max-width: 600px) {
            header { flex-direction: column; gap: 1rem; text-align: center; }
            nav a { margin: 0 0.5rem; }
            .hero-card h1 { font-size: 2.5rem; }
            .coming-soon-title { font-size: 2.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Red Rock <span>Baseball</span></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="uniforms.html" class="active">Uniforms</a>
            <a href="admin.2.html">Coaches Hub</a>
        </nav>
    </header>

    <main>
        <div class="hero-card">
            <h1>Official Uniform Package</h1>
            <p class="subtitle">Red Rock Baseball Club Gear & Apparel</p>

            <div class="coming-soon-box">
                <div class="coming-soon-title">Coming Soon</div>
                <p class="coming-soon-desc">Our 2026 Season Uniform Package details, ordering links, and sizing guides will be posted here shortly.</p>
            </div>

            <a href="index.html" class="btn-back">← Back to Main Page</a>
        </div>
    </main>

    <footer>
        &copy; 2026 Red Rock Baseball Club. All Rights Reserved.
    </footer>

</body>
</html>
