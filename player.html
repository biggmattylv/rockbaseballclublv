<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Showcase Profile | The Rock Baseball Club</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Impact&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        main { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; width: 100%; }

        .btn-back {
            background-color: #202028; color: var(--text-light); text-decoration: none;
            border: var(--border-thin); padding: 0.75rem 1.5rem; font-weight: 800;
            text-transform: uppercase; border-radius: 8px; display: inline-block;
            margin-bottom: 1.5rem; transition: all 0.2s ease;
        }

        .btn-back:hover { background-color: #2c2c38; border-color: var(--red-accent); }

        .showcase-hero {
            background: linear-gradient(135deg, #161620 0%, #08080b 100%);
            border: var(--border-thin); border-top: 6px solid var(--red-accent);
            border-radius: var(--radius-module); padding: 2.5rem; display: flex;
            gap: 2.5rem; align-items: center; flex-wrap: wrap;
            box-shadow: 0 12px 35px rgba(0,0,0,0.7); margin-bottom: 2rem;
        }

        .showcase-photo {
            width: 220px; height: 260px; object-fit: cover; border-radius: 12px;
            border: 2px solid var(--red-accent); box-shadow: 0 0 25px var(--red-glow); background-color: #000;
        }

        .showcase-info { flex: 1; min-width: 280px; }
        .showcase-name { font-family: 'Impact', sans-serif; font-size: 3.5rem; text-transform: uppercase; letter-spacing: 1px; line-height: 1; margin-bottom: 0.5rem; color: #fff; }
        .showcase-sub { color: var(--red-accent); font-size: 1.25rem; font-weight: 800; text-transform: uppercase; margin-bottom: 1.25rem; letter-spacing: 1px; }

        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }

        .metric-card {
            background-color: var(--bg-module); border: var(--border-thin);
            border-radius: var(--radius-module); padding: 1.5rem; text-align: center;
        }

        .metric-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 800; display: block; margin-bottom: 0.3rem; }
        .metric-value { font-family: 'Impact', sans-serif; font-size: 2.2rem; color: #fff; display: block; line-height: 1; }

        .section-box {
            background-color: var(--bg-module); border: var(--border-thin);
            border-radius: var(--radius-module); padding: 2rem; margin-bottom: 2rem;
        }

        .social-btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.85rem 1.5rem; font-weight: 800; text-transform: uppercase;
            border-radius: 8px; color: #fff; text-decoration: none; font-size: 0.85rem; transition: all 0.2s ease;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo-group">
                <img src="brand/logo.jpg" alt="Logo" class="logo-img">
                <div class="logo-text">The Rock <span>Baseball</span><small>Summerlin, Nevada</small></div>
            </a>
            <button class="hamburger-toggle" onclick="document.querySelector('nav').classList.toggle('mobile-active')">☰</button>
            <nav>
                <a href="index.html">Home</a>
                <a href="14u.html">14U Roster</a>
                <a href="16u.html">16U Roster</a>
                <a href="18u.html">18U Roster</a>
                <a href="uniforms.html">Uniforms</a>
                <a href="admin.2.html" class="nav-accent">🔒 Coaches Hub</a>
            </nav>
        </div>
    </header>

    <main id="showcaseContainer">
        <div style="color:var(--text-muted);">Loading player showcase profile...</div>
    </main>

    <footer>&copy; 2026 The Rock Baseball Club — Summerlin, NV</footer>

    <script>
        const SUPABASE_URL = "https://lhnizfqdwedvssvsezut.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_oGrtOIu1em1FXuYY9roobA_VmxuJdyi";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadPlayerProfile() {
            const params = new URLSearchParams(window.location.search);
            const playerId = params.get('id');

            if (!playerId) {
                document.getElementById('showcaseContainer').innerHTML = `<a href="index.html" class="btn-back">← Return Home</a><h2>No player specified in link.</h2>`;
                return;
            }

            let { data: player, error } = await supabaseClient.from('players').select('*').eq('id', playerId).single();

            if (error || !player) {
                document.getElementById('showcaseContainer').innerHTML = `<a href="javascript:history.back()" class="btn-back">← Back to Roster</a><h2>Player showcase profile not found.</h2>`;
                return;
            }

            let savedGPA = localStorage.getItem(`gpa_${player.id}`) || '3.80';
            let photoUrl = player.photo_url || 'brand/logo.jpg';
            let statusBadge = player.commit_status && player.commit_status !== 'UNCOMMITTED'
                ? `<span class="badge" style="background:var(--gold-accent)!important; color:#000!important; border-color:var(--gold-accent)!important;">${player.commit_status}</span>`
                : `<span class="badge">UNCOMMITTED PROSPECT</span>`;

            document.getElementById('showcaseContainer').innerHTML = `
                <a href="javascript:history.back()" class="btn-back">← Back to Roster</a>

                <section class="showcase-hero">
                    <img src="${photoUrl}" class="showcase-photo" alt="${player.name}">
                    <div class="showcase-info">
                        ${statusBadge}
                        <h1 class="showcase-name" style="margin-top:0.75rem;">${player.name}</h1>
                        <div class="showcase-sub">${player.team} | ${player.pos}</div>
                        <div style="font-size:0.95rem; color:var(--text-muted); line-height:1.6;">
                            <div>🏫 <strong>High School:</strong> ${player.high_school || 'Summerlin High'}</div>
                            <div>🎓 <strong>Graduation Class:</strong> ${player.grad_year || '2027'}</div>
                            <div>🎂 <strong>Age / Division:</strong> ${player.age}</div>
                        </div>
                    </div>
                </section>

                <div class="metrics-grid">
                    <div class="metric-card">
                        <span class="metric-label">Fastball Velo</span>
                        <span class="metric-value">${player.fastball_velo ? player.fastball_velo + ' MPH' : '--'}</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Exit Velocity</span>
                        <span class="metric-value">${player.exit_velo ? player.exit_velo + ' MPH' : '--'}</span>
                    </div>
                    <div class="metric-card" style="border-color:var(--gold-accent);">
                        <span class="metric-label" style="color:var(--gold-accent);">Academic GPA</span>
                        <span class="metric-value" style="color:var(--gold-accent);">${savedGPA}</span>
                    </div>
                </div>

                <!-- DEDICATED FIELDLEVEL MODULE CONTAINER -->
                <section class="section-box" style="border: 2px solid #0066cc; background: linear-gradient(135deg, #0b1528 0%, #08080c 100%); box-shadow: 0 0 25px rgba(0,102,204,0.3);">
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; margin-bottom:1rem;">
                        <div>
                            <span style="color:#3b82f6; font-size:0.75rem; font-weight:900; text-transform:uppercase; letter-spacing:1px; display:block;">Verified Video & Scouting Vault</span>
                            <h3 style="font-family:'Impact', sans-serif; font-size:2rem; text-transform:uppercase; color:#fff; margin:0;">FieldLevel Recruiting Profile</h3>
                        </div>
                        ${player.fieldlevel_url 
                            ? `<a href="${player.fieldlevel_url}" target="_blank" class="social-btn" style="background:#0066cc; box-shadow:0 0 15px rgba(0,102,204,0.6);">🎥 Launch Full FieldLevel Profile & Video →</a>`
                            : `<span style="background:#f59e0b; color:#000; font-weight:800; font-size:0.75rem; padding:0.4rem 0.8rem; border-radius:6px;">⚠️ Profile Link Pending</span>`
                        }
                    </div>

                    <p style="color:var(--text-muted); font-size:0.95rem; line-height:1.6; margin-bottom:1rem;">
                        All game film, verified pop-times, pitching mechanics, and recruiting communications for <strong>${player.name}</strong> are hosted directly on FieldLevel.
                    </p>

                    <div style="display:flex; gap:1rem; flex-wrap:wrap; align-items:center;">
                        ${player.twitter_handle 
                            ? `<a href="https://x.com/${player.twitter_handle.replace('@','')}" target="_blank" class="social-btn" style="background:#1da1f2;">🐦 Twitter / X Video Feed (${player.twitter_handle})</a>` 
                            : `<span style="color:var(--text-muted); font-size:0.85rem;">No Twitter handle linked</span>`
                        }
                    </div>
                </section>
            `;
        }

        loadPlayerProfile();
    </script>
</body>
</html>
