<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16U Division Roster | The Rock Baseball Club</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Impact&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        main { max-width: 1250px; margin: 2rem auto; padding: 0 1.5rem; width: 100%; }

        .page-header {
            background: linear-gradient(135deg, #161620 0%, #08080b 100%);
            border: var(--border-thin); border-left: 6px solid var(--red-accent);
            border-radius: var(--radius-module); padding: 2.5rem; margin-bottom: 2rem;
        }

        .page-header h1 { font-family: 'Impact', sans-serif; font-size: 3.2rem; text-transform: uppercase; letter-spacing: 2px; }
        .page-header p { color: var(--text-muted); font-size: 1rem; }

        .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
        .card-container { background-color: transparent; width: 100%; height: 500px; perspective: 1000px; }

        .card-flipper {
            position: relative; width: 100%; height: 100%; text-align: left;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d;
        }

        .card-container.flipped .card-flipper { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%;
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            border-radius: var(--radius-module); border: var(--border-thin);
            padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between;
            box-shadow: 0 8px 22px rgba(0,0,0,0.6);
        }

        .card-front { background: linear-gradient(145deg, #181822 0%, #0a0a0c 100%); border-top: 4px solid var(--red-accent); }
        .badge-row { display: flex; justify-content: space-between; align-items: center; }

        .player-photo-container {
            width: 100%; height: 140px; background-color: var(--bg-input); border: var(--border-thin);
            border-radius: 8px; margin: 0.75rem 0; overflow: hidden; display: flex;
            align-items: center; justify-content: center; color: var(--text-muted);
            font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
        }

        .player-photo-img { width: 100%; height: 100%; object-fit: cover; }
        .player-name { font-family: 'Impact', sans-serif; font-size: 2.1rem; text-transform: uppercase; letter-spacing: 1px; color: #fff; line-height: 1; margin-bottom: 0.5rem; }

        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem;
            background-color: var(--bg-input); padding: 0.6rem; border-radius: 8px; border: var(--border-thin);
        }

        .stats-item span { display: block; font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .stats-item strong { font-size: 0.9rem; color: #fff; }

        .btn-flip {
            background-color: #202028; color: var(--text-light); border: var(--border-thin);
            padding: 0.55rem; font-size: 0.72rem; font-weight: 800; text-transform: uppercase;
            border-radius: 6px; cursor: pointer; width: 100%; margin-top: 0.35rem;
        }

        .btn-flip:hover { background-color: #2c2c38; border-color: var(--red-accent); }

        .card-back { background: #14141c; transform: rotateY(180deg); border-top: 4px solid var(--gold-accent); }

        .gpa-box { background-color: var(--bg-input); border: var(--border-thin); border-radius: 8px; padding: 0.5rem; margin-top: 0.4rem; text-align: center; }
        .gpa-title { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 800; display: block; }
        .gpa-value { font-family: 'Impact', sans-serif; font-size: 1.6rem; color: var(--gold-accent); display: block; line-height: 1; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo-group">
                <img src="brand/logo.jpg" alt="Logo" class="logo-img">
                <div class="logo-text">The Rock <span>Baseball</span><small>Summerlin, Nevada</small></div>
            </a>

            <button class="hamburger-toggle" onclick="document.querySelector('nav').classList.toggle('mobile-active')">☰</button>

            <nav>
                <a href="index.html">Home</a>
                <a href="14u.html">14U Roster</a>
                <a href="16u.html" class="active">16U Roster</a>
                <a href="18u.html">18U Roster</a>
                <a href="uniforms.html">Uniforms</a>
                <a href="admin.2.html" class="nav-accent">🔒 Coaches Hub</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="page-header">
            <h1>16U Division Roster</h1>
            <p>High School Preparation & Skill Refinement Team</p>
        </div>

        <div class="roster-grid" id="rosterContainer">
            <div style="color:var(--text-muted);">Loading 16U roster...</div>
        </div>
    </main>

    <footer>&copy; 2026 The Rock Baseball Club — Summerlin, NV</footer>

    <script>
        const SUPABASE_URL = "https://lhnizfqdwedvssvsezut.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_oGrtOIu1em1FXuYY9roobA_VmxuJdyi";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadDivisionRoster() {
            try {
                let { data: players, error } = await supabaseClient.from('players').select('*').eq('active', true).order('name', { ascending: true });
                if (error) throw error;

                const container = document.getElementById('rosterContainer');
                container.innerHTML = '';

                let filtered = (players || []).filter(p => {
                    let teamLower = (p.team || '').toLowerCase();
                    return teamLower.includes('16u') || teamLower.includes('hybrid');
                });

                if (filtered.length === 0) {
                    container.innerHTML = `<div style="color:var(--text-muted); grid-column:1/-1;">⏳ Player Roster Still Loading — Summerlin 2026 Season Roster Drops Soon!</div>`;
                    return;
                }

                filtered.forEach(p => {
                    let savedGPA = localStorage.getItem(`gpa_${p.id}`) || '3.80';
                    let playerPin = p.pin || '1234';
                    let hasFieldLevel = p.fieldlevel_url && p.fieldlevel_url.trim() !== '';

                    let photoHtml = p.photo_url 
                        ? `<img src="${p.photo_url}" class="player-photo-img" alt="${p.name}">`
                        : `<span>⚾ Photo Coming Soon</span>`;

                    container.innerHTML += `
                        <div class="card-container" id="card-${p.id}">
                            <div class="card-flipper">
                                <div class="card-front">
                                    <div>
                                        <div class="badge-row">
                                            <span class="badge">${p.team}</span>
                                            <span style="font-size:0.65rem; color:var(--text-muted); font-weight:800;">ROCK LV</span>
                                        </div>
                                        <div class="player-photo-container">
                                            ${photoHtml}
                                        </div>
                                        <div class="player-name">${p.name}</div>
                                    </div>

                                    <div>
                                        <div class="stats-grid">
                                            <div class="stats-item"><span>Age</span><strong>${p.age}</strong></div>
                                            <div class="stats-item"><span>Primary Pos</span><strong>${p.pos}</strong></div>
                                        </div>
                                        <button class="btn-flip" onclick="toggleFlip('${p.id}')">🔄 Flip Card / Metrics & Portal</button>
                                    </div>
                                </div>

                                <div class="card-back">
                                    <div>
                                        <div style="background: linear-gradient(135deg, #0d1b2a 0%, #0a0a10 100%); border: 1px solid #0066cc; border-radius: 8px; padding: 0.75rem; margin-bottom: 0.5rem; box-shadow: 0 4px 12px rgba(0,102,204,0.25);">
                                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.3rem;">
                                                <span style="font-size:0.65rem; font-weight:900; color:#3b82f6; text-transform:uppercase;">⚾ FieldLevel Verified Film</span>
                                                <span style="font-size:0.55rem; background:${hasFieldLevel ? '#10b981' : '#f59e0b'}; color:#000; font-weight:800; padding:0.15rem 0.35rem; border-radius:4px;">
                                                    ${hasFieldLevel ? 'LINKED' : 'PENDING'}
                                                </span>
                                            </div>
                                            ${hasFieldLevel 
                                                ? `<a href="${p.fieldlevel_url}" target="_blank" style="display:block; text-align:center; background:#0066cc; color:#fff; font-size:0.7rem; font-weight:800; text-transform:uppercase; padding:0.45rem; border-radius:4px; text-decoration:none;">🎥 Open FieldLevel Video & Stats →</a>`
                                                : `<div style="font-size:0.65rem; color:#f59e0b; text-align:center; font-weight:700;">⚠️ FieldLevel link pending</div>`
                                            }
                                        </div>

                                        <div class="stats-grid">
                                            <div class="stats-item"><span>Grad Year</span><strong>${p.grad_year || '2028'}</strong></div>
                                            <div class="stats-item"><span>Frame / B-T</span><strong>${p.height_weight || 'N/A'} (${p.bats_throws || 'R/R'})</strong></div>
                                            <div class="stats-item"><span>FB Velo</span><strong>${p.fastball_velo ? p.fastball_velo + ' MPH' : '--'}</strong></div>
                                            <div class="stats-item"><span>Exit Velo</span><strong>${p.exit_velo ? p.exit_velo + ' MPH' : '--'}</strong></div>
                                        </div>

                                        <div class="gpa-box">
                                            <span class="gpa-title">Academic GPA Score</span>
                                            <span class="gpa-value" id="gpa-display-${p.id}">${savedGPA}</span>
                                        </div>
                                    </div>

                                    <div style="display:flex; flex-direction:column; gap:0.35rem; margin-top:0.4rem;">
                                        <button class="btn-flip" style="background:#202028; border-color:#444; color:#fff;" onclick="openPlayerPortalModal('${p.id}', '${playerPin}')">
                                            🔐 Player & Parent Portal
                                        </button>
                                        <a href="player.html?id=${p.id}" class="btn-flip" style="text-align:center; text-decoration:none; background:var(--red-accent); color:#fff;">🌟 View Full Showcase Profile →</a>
                                        <button class="btn-flip" onclick="toggleFlip('${p.id}')">↩ Back to Front</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (err) { console.error("Roster error:", err); }
        }

        function toggleFlip(id) {
            let el = document.getElementById(`card-${id}`);
            if (el) el.classList.toggle('flipped');
        }

        async function openPlayerPortalModal(playerId, correctPin) {
            let enteredPin = prompt("🔒 Restricted Access: Enter Player/Parent PIN (or Coach Passcode):");
            
            if (enteredPin !== correctPin && enteredPin !== "ROCK2026") {
                if (enteredPin !== null) alert("❌ Incorrect PIN. Access denied.");
                return;
            }

            let choice = prompt(
                "WELCOME TO THE PLAYER PORTAL\n\n" +
                "Type 1, 2, or 3 then click OK:\n" +
                "1. Edit Recruiting Metrics (GPA, FieldLevel, Twitter, Frame, Stats)\n" +
                "2. View & Print Account Statement / Ledger\n" +
                "3. 🔑 Change My Security PIN"
            );

            if (choice === "1") {
                await editPlayerSelfService(playerId);
            } else if (choice === "2") {
                await renderPlayerStatement(playerId);
            } else if (choice === "3") {
                await changePlayerPINSelfService(playerId, correctPin);
            }
        }

        async function editPlayerSelfService(playerId) {
            let { data: player } = await supabaseClient.from('players').select('*').eq('id', playerId).single();
            if (!player) return;

            let newGPA = prompt("Update Academic GPA Score (e.g. 3.85):", localStorage.getItem(`gpa_${playerId}`) || "3.80");
            if (newGPA === null) return;

            let newFieldLevel = prompt("Update FieldLevel Profile Link:", player.fieldlevel_url || "");
            if (newFieldLevel === null) return;

            let newTwitter = prompt("Update Twitter/X Handle (e.g. @PlayerHandle):", player.twitter_handle || "");
            if (newTwitter === null) return;

            let newGameChanger = prompt("Update GameChanger Profile URL:", player.gamechanger_url || "");
            if (newGameChanger === null) return;

            let newHW = prompt("Update Height & Weight (e.g. 6'0\" / 175 lbs):", player.height_weight || "");
            if (newHW === null) return;

            let newBT = prompt("Update Bats / Throws (e.g. R/R, L/R):", player.bats_throws || "R/R");
            if (newBT === null) return;

            let new60 = prompt("Update 60-Yard Dash Time (e.g. 6.85s):", player.sixty_time || "");
            if (new60 === null) return;

            let newPop = prompt("Update Catcher Pop Time (e.g. 2.05s):", player.pop_time || "");
            if (newPop === null) return;

            let newHS = prompt("Update High School:", player.high_school || "Summerlin High");
            if (newHS === null) return;

            let newGrad = prompt("Update Grad Year:", player.grad_year || "2028");
            if (newGrad === null) return;

            if (newGPA && !isNaN(parseFloat(newGPA))) localStorage.setItem(`gpa_${playerId}`, parseFloat(newGPA).toFixed(2));

            const updates = {
                fieldlevel_url: newFieldLevel,
                twitter_handle: newTwitter,
                gamechanger_url: newGameChanger,
                height_weight: newHW,
                bats_throws: newBT,
                sixty_time: new60,
                pop_time: newPop,
                high_school: newHS,
                grad_year: newGrad
            };

            await supabaseClient.from('players').update(updates).eq('id', playerId);
            alert("✅ Recruiting profile metrics updated successfully!");
            loadDivisionRoster();
        }

        async function changePlayerPINSelfService(playerId, currentPin) {
            let newPin = prompt("🔑 Enter your NEW 4-Digit Security PIN:");
            if (!newPin || newPin.trim().length < 4) {
                alert("❌ PIN must be at least 4 characters.");
                return;
            }

            let confirmPin = prompt("🔑 Confirm your NEW Security PIN:");
            if (newPin.trim() !== confirmPin.trim()) {
                alert("❌ PINs do not match. PIN change canceled.");
                return;
            }

            const { error } = await supabaseClient.from('players').update({ pin: newPin.trim() }).eq('id', playerId);
            if (error) {
                alert("Error changing PIN: " + error.message);
            } else {
                alert("✅ Success! Your security PIN has been updated.");
                loadDivisionRoster();
            }
        }

        async function renderPlayerStatement(playerId) {
            let { data: player } = await supabaseClient.from('players').select('*').eq('id', playerId).single();
            if (!player) return;

            let ledgerArray = Array.isArray(player.ledger) ? player.ledger : [];
            let balance = ledgerArray.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);

            let statementRows = ledgerArray.map(item => `
                <tr>
                    <td style="padding: 8px; border-bottom: 1px solid #ddd;">${item.date || 'N/A'}</td>
                    <td style="padding: 8px; border-bottom: 1px solid #ddd;">${item.desc || 'Fee/Payment'}</td>
                    <td style="padding: 8px; border-bottom: 1px solid #ddd; text-align: right; color: ${item.amount >= 0 ? '#d97706' : '#10b981'}; font-weight: bold;">
                        ${item.amount >= 0 ? '+' : ''}$${parseFloat(item.amount).toFixed(2)}
                    </td>
                </tr>
            `).join('');

            let win = window.open('', '_blank', 'width=700,height=800');
            win.document.write(`
                <html>
                <head>
                    <title>Account Statement - ${player.name}</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 30px; color: #222; }
                        .header { border-bottom: 3px solid #ff1a35; padding-bottom: 10px; margin-bottom: 20px; }
                        .title { font-size: 24px; font-weight: bold; text-transform: uppercase; }
                        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                        th { background: #111; color: #fff; padding: 10px; text-align: left; }
                        .balance-box { background: #f4f4f5; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: right; font-size: 18px; font-weight: bold; }
                        .btn-print { background: #ff1a35; color: white; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; margin-top: 20px; border-radius: 5px; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <div class="title">The Rock Baseball Club</div>
                        <div>Official Player Account Ledger & Statement</div>
                    </div>
                    <div><strong>Player Name:</strong> ${player.name}</div>
                    <div><strong>Team/Division:</strong> ${player.team}</div>
                    <div><strong>Date Issued:</strong> ${new Date().toLocaleDateString()}</div>
                    <table>
                        <thead><tr><th>Date</th><th>Description</th><th style="text-align: right;">Amount</th></tr></thead>
                        <tbody>${statementRows || '<tr><td colspan="3" style="padding:15px; text-align:center;">No statement history recorded.</td></tr>'}</tbody>
                    </table>
                    <div class="balance-box">Current Outstanding Balance: <span style="color: ${balance > 0 ? '#ff1a35' : '#10b981'};">$${balance.toFixed(2)}</span></div>
                    <button class="btn-print" onclick="window.print()">🖨️️ Print / Save as PDF Statement</button>
                </body>
                </html>
            `);
        }

        loadDivisionRoster();
    </script>
</body>
</html>
