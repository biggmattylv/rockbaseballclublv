    <script>
        (function() {
            window.scrollTo(0, 0);
            const COACH_HUB_PASSWORD = "ROCK2026";
            const authenticated = sessionStorage.getItem("coaches_hub_auth");

            if (authenticated !== "true") {
                const entry = prompt("🔒 Restricted Access: Enter Coaches Hub Password:");
                if (entry === COACH_HUB_PASSWORD) {
                    sessionStorage.setItem("coaches_hub_auth", "true");
                } else {
                    alert("❌ Unauthorized access. Redirecting to home page.");
                    window.location.href = "index.html";
                }
            }
        })();
    </script>

    <style>
        .admin-dashboard-layout {
            display: flex;
            min-height: calc(100vh - 160px);
            max-width: 1400px;
            margin: 1.5rem auto;
            padding: 0 1.5rem;
            gap: 2rem;
        }

        .admin-sidebar {
            width: 260px;
            flex-shrink: 0;
            background: #111118;
            border: var(--border-thin);
            border-top: 4px solid var(--red-accent);
            border-radius: var(--radius-module);
            padding: 1.25rem;
            height: fit-content;
            position: sticky;
            top: 100px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .sidebar-title {
            font-family: 'Impact', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gold-accent);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #222230;
        }

        .nav-tab-btn {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.85rem 1rem;
            margin-bottom: 0.5rem;
            background: #181822;
            border: 1px solid #262636;
            color: var(--text-muted);
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.8rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .nav-tab-btn:hover { background: #222230; color: #fff; border-color: var(--red-accent); }

        .nav-tab-btn.active {
            background: var(--red-accent);
            color: #fff;
            border-color: var(--red-accent);
            box-shadow: 0 0 15px var(--red-glow);
        }

        .admin-content-panel { flex: 1; min-width: 0; }
        .tab-content-section { display: none; }

        .tab-content-section.active {
            display: block;
            animation: fadeIn 0.25s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-header {
            background: linear-gradient(135deg, #161620 0%, #08080b 100%);
            border: var(--border-thin); 
            border-left: 6px solid var(--red-accent);
            border-radius: var(--radius-module); 
            padding: 2rem 2.5rem; 
            margin-bottom: 2rem;
        }

        .page-header h1 { font-family: 'Impact', sans-serif; font-size: 2.8rem; text-transform: uppercase; letter-spacing: 2px; margin: 0; }
        .page-header p { color: var(--text-muted); font-size: 0.95rem; margin-top: 0.3rem; }

        /* FINANCIAL SUMMARY BANNER */
        .financial-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .financial-metric-card {
            background: #12121a;
            border: var(--border-thin);
            border-radius: var(--radius-module);
            padding: 1.25rem;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        }

        .financial-metric-card .title {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }

        .financial-metric-card .amount {
            font-family: 'Impact', sans-serif;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        .admin-form-module {
            background-color: var(--bg-module); border: var(--border-thin);
            border-radius: var(--radius-module); padding: 2rem; margin-bottom: 2rem;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .toolbar-title {
            font-family: 'Impact', sans-serif; font-size: 1.6rem; text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; color: #fff;
        }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .input-group label { display: block; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; background-color: var(--bg-input); border: var(--border-thin); border-radius: 8px; padding: 0.75rem; color: #fff; font-weight: 600; }

        .switch { position: relative; display: inline-block; width: 48px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #202028; transition: .3s; border-radius: 24px; border: 1px solid #333; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--red-accent); border-color: var(--red-accent); }
        input:checked + .slider:before { transform: translateX(24px); }

        .btn-submit {
            background-color: var(--red-accent); color: #fff; border: none; padding: 0.85rem 1.5rem;
            font-weight: 800; text-transform: uppercase; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 15px var(--red-glow); transition: all 0.2s ease; margin-top: 1rem;
        }

        .btn-submit:hover { background-color: #ff334b; }

        .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }

        .player-card, .coach-card-hub, .rss-card-hub, .sponsor-card-hub {
            background-color: var(--bg-module); border: var(--border-thin);
            border-radius: var(--radius-module); padding: 1.5rem; display: flex;
            flex-direction: column; justify-content: space-between;
        }

        /* 3D FLIP CARD FOR ACCOUNT BALANCES */
        .flip-card-container {
            perspective: 1000px;
            height: 480px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s ease;
            transform-style: preserve-3d;
        }

        .flip-card-container.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            background-color: var(--bg-module);
            border: var(--border-thin);
            border-radius: var(--radius-module);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }

        .flip-card-back {
            transform: rotateY(180deg);
            background: #0d0d14;
            border-color: var(--gold-accent);
        }

        .photo-preview { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; border: var(--border-thin); margin-bottom: 0.75rem; background-color: #000; }
        .ledger-box { background-color: var(--bg-input); border: var(--border-thin); border-radius: 8px; padding: 1rem; margin-top: 0.75rem; }
        .balance-row { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 1rem; margin-bottom: 0.5rem; }
        .ledger-list { max-height: 140px; overflow-y: auto; font-size: 0.75rem; color: var(--text-muted); border-top: var(--border-thin); padding-top: 0.5rem; }
        .ledger-entry { display: flex; justify-content: space-between; padding: 0.3rem 0; border-bottom: 1px solid #1a1a24; }
        .add-charge-group { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
        .add-charge-group input { background: #000; border: var(--border-thin); border-radius: 4px; padding: 0.4rem; color: #fff; font-size: 0.8rem; width: 100%; }
