<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Roster & Admin Dashboard | Red Rock Baseball Club</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Impact&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0a0c;
            --bg-module: #121216;
            --bg-input: #08080a;
            --red-accent: #d3122a;
            --red-glow: rgba(211, 18, 42, 0.4);
            --green-accent: #10b981;
            --text-light: #ffffff;
            --text-muted: #9a9ab0;
            --border-thin: 1px solid #23232c;
            --radius-module: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
        }

        .module-container {
            background-color: var(--bg-module);
            border: var(--border-thin);
            border-radius: var(--radius-module);
            padding: 1.75rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .header-module {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--red-accent);
        }

        .header-module h1 { font-family: 'Impact', sans-serif; font-size: 2.2rem; text-transform: uppercase; letter-spacing: 1.5px; }

        .toolbar {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .btn-main {
            background-color: var(--red-accent);
            color: #fff;
            border: none;
            padding: 0.75rem 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-main:hover { background-color: #ff1a35; box-shadow: 0 0 15px var(--red-glow); }

        /* 3D FLIP CARD ROSTER GRID */
        .roster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .card-container {
            background-color: transparent;
            width: 100%;
            height: 340px;
            perspective: 1000px;
        }

        .card-flipper {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: left;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-container.flipped .card-flipper {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: var(--radius-module);
            border: var(--border-thin);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 6px 18px rgba(0,0,0,0.5);
        }

        /* FRONT OF CARD */
        .card-front {
            background: linear-gradient(145deg, #18181f 0%, #0a0a0c 100%);
            border-top: 3px solid var(--red-accent);
        }

        .card-front .badge {
            align-self: flex-start;
            background-color: rgba(211, 18, 42, 0.15);
            color: var(--red-accent);
            border: 1px solid var(--red-accent);
            padding: 0.2rem 0.6rem;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 4px;
        }

        .card-front .player-name {
            font-family: 'Impact', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 1px;
            color: var(--text-light);
            text-transform: uppercase;
            margin: 0.4rem 0 0.1rem;
        }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            background-color: var(--bg-input);
            padding: 0.75rem;
            border-radius: 8px;
            border: var(--border-thin);
            margin-top: 0.8rem;
        }

        .stats-item span { display: block; font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .stats-item strong { font-size: 0.95rem; color: var(--text-light); }

        .btn-flip {
            background-color: #202028;
            color: var(--text-light);
            border: var(--border-thin);
            padding: 0.6rem;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 0.8rem;
            width: 100%;
        }

        .btn-flip:hover { background-color: #2c2c38; border-color: var(--red-accent); }

        /* BACK OF CARD */
        .card-back {
            background: #14141a;
            transform: rotateY(180deg);
            border-top: 3px solid var(--green-accent);
            overflow-y: auto;
        }

        .card-back h3 {
            font-family: 'Impact', sans-serif;
            font-size: 1.3rem;
            color: var(--green-accent);
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .info-group { margin-bottom: 0.5rem; }
        .info-group label { display: block; font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .info-group p { font-size: 0.85rem; color: var(--text-light); font-weight: 600; word-break: break-all; }

        .action-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem;
            margin-top: 0.6rem;
        }

        .edit-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.3rem;
            margin-top: 0.4rem;
        }

        button.card-btn {
            background-color: var(--red-accent);
            color: #fff;
            border: none;
            padding: 0.45rem;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
        }

        button.card-btn-green { background-color: var(--green-accent); }
        button.card-btn-dark { background-color: #27272a; color: #fff; }
        button.card-btn-dark:hover { background-color: #3f3f46; }

        iframe { width: 100%; height: 500px; border: var(--border-thin); border-radius: 8px; background-color: #fff; }

        @media (max-width: 768px) { body { padding: 1rem; } .header-module { flex-direction: column; align-items: flex-start; gap: 0.5rem; } }
    </style>
</head>
<body>

    <script>
        let password = prompt("Enter Admin Password:");
        if (password !== "redrock2026") {
            alert("Unauthorized Access.");
            document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:5rem;'>ACCESS DENIED</h1>";
        }
    </script>

    <div class="module-container header-module">
        <div>
            <h1>Red Rock Digital Roster</h1>
            <span style="color: var(--red-accent);">3D Interactive Cards & Admin Controls</span>
        </div>
        <span>Manager Hub</span>
    </div>

    <div class="module-container">
        <h2 style="font-family:'Impact'; font-size:1.6rem; text-transform:uppercase;">Player Roster Deck</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Manage player profiles, duplicate templates, edit details, or trigger payment solicitations.</p>
        
        <div class="toolbar">
            <button class="btn-main" onclick="addNewPlayer()">➕ Add New Player Card</button>
        </div>

        <div class="roster-grid" id="rosterContainer">
            <!-- Cards Render Dynamically Here -->
        </div>
    </div>

    <div class="module-container">
        <h2 style="font-family:'Impact'; font-size:1.6rem; text-transform:uppercase;">Master Google Sheet Ledger</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">Edits made in Google Sheets auto-reflect across your organization.</p>
        <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vROIJwAWb4eF9lS4kuK0IRhe1rVpNLx1KkN6fwXXAggVRxlr-A2_zMRX10ZoTLZ7dzhKrxQ4yQjV0eq/pubhtml?widget=true&headers=false"></iframe>
    </div>

    <script>
        // Core Player Dataset
        let roster = [
            { id: 1, name: "John Doe", team: "16U / 18U Hybrid", age: "16 Yrs", pos: "SS / RHP", email: "parent.doe@example.com", status: "Paid (Sept Dues)" },
            { id: 2, name: "Alex Smith", team: "16U Division", age: "15 Yrs", pos: "Catcher", email: "smith.family@example.com", status: "Pending ($300 Due)" },
            { id: 3, name: "Mike Johnson", team: "18U Division", age: "17 Yrs", pos: "OF / LHP", email: "johnson88@example.com", status: "Paid (Sept Dues)" }
        ];

        // Render Cards Function
        function renderRoster() {
            const container = document.getElementById('rosterContainer');
            container.innerHTML = '';

            roster.forEach(player => {
                const cardHTML = `
                <div class="card-container" id="card-${player.id}">
                    <div class="card-flipper">
                        <!-- FRONT -->
                        <div class="card-front">
                            <div>
                                <span class="badge">${player.team}</span>
                                <div class="player-name">${player.name}</div>
                            </div>
                            <div class="stats-row">
                                <div class="stats-item">
                                    <span>Age</span>
                                    <strong>${player.age}</strong>
                                </div>
                                <div class="stats-item">
                                    <span>Primary Pos</span>
                                    <strong>${player.pos}</strong>
                                </div>
                            </div>
                            <button class="btn-flip" onclick="toggleFlip(${player.id})">🔄 Flip Card / Admin Actions</button>
                        </div>
                        <!-- BACK -->
                        <div class="card-back">
                            <div>
                                <h3>Admin & Payment Hub</h3>
                                <div class="info-group">
                                    <label>Parent Contact</label>
                                    <p>${player.email}</p>
                                </div>
                                <div class="info-group">
                                    <label>Ledger Status</label>
                                    <p style="color: ${player.status.includes('Paid') ? 'var(--green-accent)' : 'var(--red-accent)'}">${player.status}</p>
                                </div>
                            </div>
                            <div>
                                <div class="action-btns">
                                    <button class="card-btn" onclick="quickEmail('${player.email}', '${player.name}')">✉️ Email</button>
                                    <button class="card-btn-green card-btn" onclick="quickLog('${player.name}')">✅ Log Pay</button>
                                </div>
                                <div class="edit-controls">
                                    <button class="card-btn-dark card-btn" onclick="editPlayer(${player.id})">✏️ Edit</button>
                                    <button class="card-btn-dark card-btn" onclick="duplicatePlayer(${player.id})">📋 Copy</button>
                                    <button class="card-btn-dark card-btn" style="background-color:#7f1d1d;" onclick="deletePlayer(${player.id})">🗑️ Del</button>
                                </div>
                                <button class="btn-flip" style="margin-top:0.4rem;" onclick="toggleFlip(${player.id})">↩️ Back to Front</button>
                            </div>
                        </div>
                    </div>
                </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // Toggle 3D Flip
        function toggleFlip(id) {
            document.getElementById(`card-${id}`).classList.toggle('flipped');
        }

        // 1. Add Player
        function addNewPlayer() {
            let name = prompt("Enter Player Name:");
            if (!name) return;
            let team = prompt("Enter Team Division (16U, 18U, Hybrid):", "16U Division");
            let age = prompt("Enter Player Age:", "16 Yrs");
            let pos = prompt("Enter Primary Position:", "Shortstop");
            let email = prompt("Enter Parent Email:", "parent@example.com");

            let newId = Date.now();
            roster.push({ id: newId, name, team, age, pos, email, status: "Pending Dues" });
            renderRoster();
        }

        // 2. Edit Player
        function editPlayer(id) {
            let player = roster.find(p => p.id === id);
            if (!player) return;

            player.name = prompt("Edit Player Name:", player.name) || player.name;
            player.team = prompt("Edit Team Division:", player.team) || player.team;
            player.age = prompt("Edit Age:", player.age) || player.age;
            player.pos = prompt("Edit Position:", player.pos) || player.pos;
            player.email = prompt("Edit Parent Email:", player.email) || player.email;
            player.status = prompt("Edit Payment Status:", player.status) || player.status;

            renderRoster();
        }

        // 3. Duplicate Player
        function duplicatePlayer(id) {
            let player = roster.find(p => p.id === id);
            if (!player) return;

            let clone = { ...player, id: Date.now(), name: `${player.name} (Copy)` };
            roster.push(clone);
            renderRoster();
        }

        // 4. Delete Player
        function deletePlayer(id) {
            if (confirm("Are you sure you want to delete this player card?")) {
                roster = roster.filter(p => p.id !== id);
                renderRoster();
            }
        }

        // Send Email
        function quickEmail(email, playerName) {
            let zelleEmail = "coachmatty@redrockbaseball.com";
            let subject = encodeURIComponent(`Red Rock Baseball - Payment Request for ${playerName}`);
            let body = encodeURIComponent(`Hi,\n\nThis is a payment request for Red Rock Baseball Club.\n\nPlayer: ${playerName}\n\nPlease submit payment via Zelle to:\nZelle Account: ${zelleEmail}\nMemo Line: ${playerName} - Dues\n\nThank you,\nCoach Matty`);
            window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
        }

        // Log Payment
        function quickLog(playerName) {
            let amount = prompt(`Enter amount received for ${playerName}:`, "300");
            if (amount) {
                let player = roster.find(p => p.name === playerName);
                if(player) player.status = `Paid ($${amount})`;
                renderRoster();
                alert(`SUCCESS:\nRecorded $${amount} payment for ${playerName}. Update your Google Sheet master file below!`);
            }
        }

        // Initial Load
        renderRoster();
    </script>
</body>
</html>
