<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coaches Hub | Red Rock Baseball Club</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Impact&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0a0c;
            --bg-module: #121216;
            --bg-input: #08080a;
            --red-accent: #d3122a;
            --red-glow: rgba(211, 18, 42, 0.4);
            --green-accent: #10b981;
            --text-light: #ffffff;
            --text-muted: #9a9ab0;
            --border-thin: 1px solid #23232c;
            --radius-module: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        #protectedContent {
            display: none;
            padding: 2rem;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .module-container {
            background-color: var(--bg-module);
            border: var(--border-thin);
            border-radius: var(--radius-module);
            padding: 1.75rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .header-module {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--red-accent);
        }

        .header-module h1 { font-family: 'Impact', sans-serif; font-size: 2.2rem; text-transform: uppercase; letter-spacing: 1.5px; }

        .toolbar {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            background-color: var(--bg-input);
            border: var(--border-thin);
            border-radius: 8px;
            padding: 0.2rem;
        }

        .btn-filter {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-filter.active {
            background-color: var(--red-accent);
            color: #fff;
        }

        .btn-main {
            background-color: var(--red-accent);
            color: #fff;
            border: none;
            padding: 0.75rem 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-main:hover { background-color: #ff1a35; box-shadow: 0 0 15px var(--red-glow); }

        .btn-sec {
            background-color: #202028;
            color: var(--text-light);
            border: var(--border-thin);
            padding: 0.75rem 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-sec:hover { background-color: #2c2c38; border-color: var(--red-accent); }

        .roster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .card-container {
            background-color: transparent;
            width: 100%;
            height: 440px;
            perspective: 1000px;
        }

        .card-flipper {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: left;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-container.flipped .card-flipper {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: var(--radius-module);
            border: var(--border-thin);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 6px 18px rgba(0,0,0,0.5);
        }

        .card-front {
            background: linear-gradient(145deg, #18181f 0%, #0a0a0c 100%);
            border-top: 3px solid var(--red-accent);
        }

        .card-front.inactive-card {
            opacity: 0.6;
            border-top: 3px solid #6b7280;
        }

        .badge-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background-color: rgba(211, 18, 42, 0.15);
            color: var(--red-accent);
            border: 1px solid var(--red-accent);
            padding: 0.2rem 0.6rem;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 4px;
        }

        .badge-status {
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }

        .badge-status.active { background-color: rgba(16, 185, 129, 0.2); color: var(--green-accent); border: 1px solid var(--green-accent); }
        .badge-status.inactive { background-color: rgba(107, 114, 128, 0.2); color: #9ca3af; border: 1px solid #6b7280; }

        .card-front .player-name {
            font-family: 'Impact', sans-serif;
            font-size: 2rem;
            letter-spacing: 1px;
            color: var(--text-light);
            text-transform: uppercase;
            margin: 0.5rem 0 0.1rem;
        }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            background-color: var(--bg-input);
            padding: 0.75rem;
            border-radius: 8px;
            border: var(--border-thin);
            margin-top: 0.8rem;
        }

        .stats-item span { display: block; font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .stats-item strong { font-size: 0.95rem; color: var(--text-light); }

        .balance-box {
            background-color: #0d0d12;
            border: var(--border-thin);
            padding: 0.5rem;
            border-radius: 6px;
            margin-top: 0.5rem;
            text-align: center;
        }

        .btn-flip {
            background-color: #202028;
            color: var(--text-light);
            border: var(--border-thin);
            padding: 0.65rem;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 0.6rem;
            width: 100%;
        }

        .btn-flip:hover { background-color: #2c2c38; border-color: var(--red-accent); }

        .card-back {
            background: #14141a;
            transform: rotateY(180deg);
            border-top: 3px solid var(--green-accent);
            overflow-y: auto;
        }

        .card-back h3 {
            font-family: 'Impact', sans-serif;
            font-size: 1.3rem;
            color: var(--green-accent);
            text-transform: uppercase;
            margin-bottom: 0.2rem;
        }

        .info-group { margin-bottom: 0.4rem; }
        .info-group label { display: block; font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .info-group p { font-size: 0.85rem; color: var(--text-light); font-weight: 600; word-break: break-all; }

        .ledger-box {
            background-color: var(--bg-input);
            border: var(--border-thin);
            border-radius: 6px;
            padding: 0.6rem;
            max-height: 100px;
            overflow-y: auto;
            margin-top: 0.3rem;
        }

        .ledger-item {
            font-size: 0.72rem;
            color: var(--text-light);
            border-bottom: 1px solid #1c1c24;
            padding: 0.25rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ledger-item:last-child { border-bottom: none; }
        .ledger-item .pay-date { color: var(--text-muted); font-size: 0.65rem; }

        .ledger-edit-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.7rem;
            margin-left: 0.4rem;
        }

        .action-btns {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.3rem;
            margin-top: 0.6rem;
        }

        .edit-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 0.3rem;
            margin-top: 0.4rem;
        }

        button.card-btn {
            background-color: var(--red-accent);
            color: #fff;
            border: none;
            padding: 0.5rem 0.2rem;
            font-size: 0.62rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        button.card-btn-green { background-color: var(--green-accent); }
        button.card-btn-dark { background-color: #27272a; color: #fff; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-card {
            background-color: var(--bg-module);
            border: var(--border-thin);
            border-radius: var(--radius-module);
            padding: 2rem;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        .modal-card h2 { font-family: 'Impact', sans-serif; font-size: 1.8rem; text-transform: uppercase; margin-bottom: 0.5rem; }
        .modal-card label { display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-top: 0.8rem; }
        .modal-card input, .modal-card select { width: 100%; padding: 0.75rem; margin-top: 0.3rem; background-color: var(--bg-input); border: var(--border-thin); border-radius: 6px; color: #fff; font-family: 'Montserrat', sans-serif; }

        iframe { width: 100%; height: 500px; border: var(--border-thin); border-radius: 8px; background-color: #fff; }

        @media (max-width: 768px) { .header-module { flex-direction: column; align-items: flex-start; gap: 0.5rem; } }
    </style>
</head>
<body>

    <script>
        (function authenticate() {
            let currentPassword = localStorage.getItem('coachesHubPassword') || "redrock2026";
            let entry = prompt("🔒 COACHES HUB RESTRICTED ACCESS\nEnter Password:");
            
            if (entry === currentPassword) {
                window.addEventListener('DOMContentLoaded', () => {
                    document.getElementById('protectedContent').style.display = 'block';
                });
            } else {
                alert("❌ Unauthorized Access. Access Denied.");
                document.documentElement.innerHTML = `
                    <body style="background-color:#0a0a0c; color:#d3122a; font-family:sans-serif; text-align:center; padding-top:10rem;">
                        <h1 style="font-size:3rem; margin-bottom:1rem;">ACCESS DENIED</h1>
                        <p style="color:#9a9ab0;">You do not have permission to view the Coaches Hub.</p>
                        <a href="index.html" style="color:#fff; text-decoration:underline; margin-top:2rem; display:inline-block;">Return to Main Website</a>
                    </body>
                `;
            }
        })();
    </script>

    <div id="protectedContent">

        <div class="module-container header-module">
            <div>
                <h1>Coaches Hub</h1>
                <span style="color: var(--red-accent);">Restricted Staff Operations & Admin Controls</span>
            </div>
            <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.8rem; font-weight: 700;">← Exit to Website</a>
        </div>

        <div class="module-container">
            <h2 style="font-family:'Impact'; font-size:1.6rem; text-transform:uppercase;">Player Roster Deck</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Manage player status, issue charges, log/edit Zelle payments, and sync live to Google Sheets.</p>
            
            <div class="toolbar">
                <div class="filter-group">
                    <button class="btn-filter active" id="filter-active" onclick="setFilter('active')">Active</button>
                    <button class="btn-filter" id="filter-inactive" onclick="setFilter('inactive')">Inactive</button>
                    <button class="btn-filter" id="filter-all" onclick="setFilter('all')">All</button>
                </div>
                
                <button class="btn-main" onclick="addNewPlayer()">➕ Add New Player</button>
                <button class="btn-sec" onclick="resetDefaultRoster()">🔄 Reset Roster</button>
                <button class="btn-sec" onclick="changeAdminPassword()">🔐 Change Password</button>
            </div>

            <div class="roster-grid" id="rosterContainer">
                <!-- Dynamic Cards Render Here -->
            </div>
        </div>

        <div class="module-container">
            <h2 style="font-family:'Impact'; font-size:1.6rem; text-transform:uppercase;">Master Google Sheet Ledger</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">Live synchronized spreadsheet feed.</p>
            <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vROIJwAWb4eF9lS4kuK0IRhe1rVpNLx1KkN6fwXXAggVRxlr-A2_zMRX10ZoTLZ7dzhKrxQ4yQjV0eq/pubhtml?widget=true&headers=false"></iframe>
        </div>

    </div>

    <!-- ENTRY MODAL -->
    <div class="modal-overlay" id="entryModal">
        <div class="modal-card">
            <h2 id="modalTitle">Record Transaction</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted);" id="modalPlayerName">Player Ledger Update</p>
            
            <input type="hidden" id="modalPlayerId">
            <input type="hidden" id="modalType">
            <input type="hidden" id="modalLedgerIndex" value="-1">

            <label>Date</label>
            <input type="date" id="modalDate">

            <label>Amount ($)</label>
            <input type="number" id="modalAmount" placeholder="300">

            <label>Description / Purpose</label>
            <input type="text" id="modalDesc" placeholder="e.g. Oct Dues, Tournament Fee, Zelle Payment">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 1.5rem;">
                <button class="btn-main" id="modalSubmitBtn" onclick="submitModalEntry()">Save Entry</button>
                <button class="btn-sec" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhQ90mNYgUwefrKFo3k2u2SQ7Cs7i2smvfyFmonqSs6t-T3M8vW5Z7nIZLWEs06ONN/exec"; 

        let currentFilter = 'active';

        const defaultSampleRoster = [
            { 
                id: 1, name: "John Doe", team: "16U / 18U Hybrid", age: "16 Yrs", pos: "SS / RHP", email: "parent.doe@example.com", active: true,
                ledger: [
                    { type: "charge", date: "2026-09-01", amount: 300, desc: "Sept Dues" },
                    { type: "payment", date: "2026-09-02", amount: 300, desc: "Zelle Payment" }
                ]
            },
            { 
                id: 2, name: "Alex Smith", team: "16U Division", age: "15 Yrs", pos: "Catcher", email: "smith.family@example.com", active: true,
                ledger: [
                    { type: "charge", date: "2026-09-01", amount: 300, desc: "Sept Dues" }
                ]
            }
        ];

        let roster = [];
        try {
            let stored = localStorage.getItem('redRockRoster');
            roster = stored ? JSON.parse(stored) : defaultSampleRoster;
            if (!Array.isArray(roster) || roster.length === 0) {
                roster = defaultSampleRoster;
            }
        } catch(e) {
            roster = defaultSampleRoster;
        }

        function saveRoster() {
            localStorage.setItem('redRockRoster', JSON.stringify(roster));
        }

        function resetDefaultRoster() {
            if (confirm("Reset roster cards to default sample data?")) {
                roster = defaultSampleRoster;
                saveRoster();
                renderRoster();
            }
        }

        function syncToGoogleSheets(action, payload) {
            if (!GOOGLE_SCRIPT_URL) return;
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: action, ...payload })
            }).catch(err => console.error("Sheets Sync Error:", err));
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            document.getElementById(`filter-${filter}`).classList.add('active');
            renderRoster();
        }

        function renderRoster() {
            const container = document.getElementById('rosterContainer');
            if(!container) return;
            container.innerHTML = '';

            let filteredList = roster.filter(player => {
                if (currentFilter === 'active') return player.active !== false;
                if (currentFilter === 'inactive') return player.active === false;
                return true;
            });

            if (filteredList.length === 0) {
                container.innerHTML = `<div style="color:var(--text-muted); font-size:0.9rem; grid-column: 1 / -1;">No players found in this view. Click '➕ Add New Player' above to create one.</div>`;
                return;
            }

            filteredList.forEach(player => {
                let isActive = player.active !== false;
                let totalCharges = 0;
                let totalPayments = 0;
                let ledgerHTML = '';

                if (player.ledger && player.ledger.length > 0) {
                    player.ledger.forEach((item, index) => {
                        if (item.type === 'charge') totalCharges += item.amount;
                        if (item.type === 'payment') totalPayments += item.amount;

                        let isCharge = item.type === 'charge';
                        ledgerHTML += `
                            <div class="ledger-item">
                                <div>
                                    <span style="color:${isCharge ? '#f87171' : 'var(--green-accent)'}; font-weight:700;">${isCharge ? '[CHARGE]' : '[PAID]'}</span>
                                    <span>${item.desc}</span> 
                                    <span class="pay-date">(${item.date})</span>
                                </div>
                                <div>
                                    <strong style="color:${isCharge ? '#f87171' : 'var(--green-accent)'}">${isCharge ? '-' : '+'}$${item.amount}</strong>
                                    <button class="ledger-edit-btn" onclick="editLedgerItem(${player.id}, ${index})">✏️</button>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    ledgerHTML = `<div style="font-size:0.75rem; color:var(--text-muted); padding:0.2rem 0;">No ledger items recorded.</div>`;
                }

                let balance = totalCharges - totalPayments;
                let balanceColor = balance > 0 ? 'var(--red-accent)' : 'var(--green-accent)';
                let balanceText = balance > 0 ? `$${balance} Due` : balance === 0 ? '$0 (Settled)' : `$${Math.abs(balance)} Credit`;

                const cardHTML = `
                <div class="card-container" id="card-${player.id}">
                    <div class="card-flipper">
                        <!-- FRONT -->
                        <div class="card-front ${!isActive ? 'inactive-card' : ''}">
                            <div>
                                <div class="badge-row">
                                    <span class="badge">${player.team}</span>
                                    <span class="badge-status ${isActive ? 'active' : 'inactive'}">${isActive ? 'Active' : 'Inactive'}</span>
                                </div>
                                <div class="player-name">${player.name}</div>
                            </div>
                            
                            <div>
                                <div class="stats-row">
                                    <div class="stats-item">
                                        <span>Age</span>
                                        <strong>${player.age}</strong>
                                    </div>
                                    <div class="stats-item">
                                        <span>Primary Pos</span>
                                        <strong>${player.pos}</strong>
                                    </div>
                                </div>

                                <div class="balance-box">
                                    <span style="font-size:0.65rem; color:var(--text-muted); text-transform:uppercase; font-weight:700;">Account Balance:</span>
                                    <strong style="display:block; color:${balanceColor}; font-size:1.1rem;">${balanceText}</strong>
                                </div>
                            </div>

                            <button class="btn-flip" onclick="toggleFlip(${player.id})">🔄 Flip Card / Admin Actions</button>
                        </div>

                        <!-- BACK -->
                        <div class="card-back">
                            <div>
                                <h3>Admin & Ledger Hub</h3>
                                <div class="info-group">
                                    <label>Parent Contact Email</label>
                                    <p>${player.email}</p>
                                </div>
                                
                                <div class="info-group">
                                    <label>Ledger History (Click ✏️ to Edit Item)</label>
                                    <div class="ledger-box">
                                        ${ledgerHTML}
                                    </div>
                                </div>
                            </div>

                            <div>
                                <div class="action-btns">
                                    <button class="card-btn" style="background-color:#b91c1c;" onclick="openEntryModal(${player.id}, '${player.name}', 'charge')">➕ Add Charge</button>
                                    <button class="card-btn-green card-btn" onclick="openEntryModal(${player.id}, '${player.name}', 'payment')">✅ Log Pay</button>
                                    <button class="card-btn" style="background-color:#1d4ed8;" onclick="quickEmail('${player.email}', '${player.name}', ${balance})">✉️ Email</button>
                                </div>

                                <div class="edit-controls">
                                    <button class="card-btn-dark card-btn" onclick="toggleStatus(${player.id})">${isActive ? '⏸️ Deactivate' : '▶️ Activate'}</button>
                                    <button class="card-btn-dark card-btn" onclick="editPlayer(${player.id})">✏️ Edit</button>
                                    <button class="card-btn-dark card-btn" onclick="duplicatePlayer(${player.id})">📋 Copy</button>
                                    <button class="card-btn-dark card-btn" style="background-color:#7f1d1d;" onclick="deletePlayer(${player.id})">🗑️ Del</button>
                                </div>
                                <button class="btn-flip" style="margin-top:0.4rem;" onclick="toggleFlip(${player.id})">↩️ Back to Front</button>
                            </div>
                        </div>
                    </div>
                </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function toggleFlip(id) {
            let el = document.getElementById(`card-${id}`);
            if (el) el.classList.toggle('flipped');
        }

        function toggleStatus(id) {
            let player = roster.find(p => p.id === id);
            if (player) {
                player.active = player.active === false ? true : false;
                saveRoster();
                syncToGoogleSheets('savePlayer', { player: player });
                renderRoster();
            }
        }

        function openEntryModal(playerId, playerName, type, ledgerIndex = -1) {
            document.getElementById('modalPlayerId').value = playerId;
            document.getElementById('modalType').value = type;
            document.getElementById('modalLedgerIndex').value = ledgerIndex;

            let player = roster.find(p => p.id === playerId);
            let isEdit = ledgerIndex >= 0;

            document.getElementById('modalPlayerName').innerText = `${isEdit ? 'Edit' : 'Record'} ${type === 'charge' ? 'Charge' : 'Payment'} for ${playerName}`;
            document.getElementById('modalTitle').innerText = isEdit ? 'Edit Ledger Entry' : (type === 'charge' ? 'Add Charge to Account' : 'Record Received Payment');
            
            if (isEdit && player && player.ledger[ledgerIndex]) {
                let item = player.ledger[ledgerIndex];
                document.getElementById('modalDate').value = item.date;
                document.getElementById('modalAmount').value = item.amount;
                document.getElementById('modalDesc').value = item.desc;
            } else {
                document.getElementById('modalDate').valueAsDate = new Date();
                document.getElementById('modalAmount').value = '';
                document.getElementById('modalDesc').value = type === 'charge' ? 'Monthly Dues' : 'Zelle Payment';
            }
            
            document.getElementById('entryModal').style.display = 'flex';
        }

        function editLedgerItem(playerId, index) {
            let player = roster.find(p => p.id === playerId);
            if (player && player.ledger[index]) {
                let item = player.ledger[index];
                openEntryModal(playerId, player.name, item.type, index);
            }
        }

        function closeModal() {
            document.getElementById('entryModal').style.display = 'none';
        }

        function submitModalEntry() {
            let id = parseInt(document.getElementById('modalPlayerId').value);
            let type = document.getElementById('modalType').value;
            let index = parseInt(document.getElementById('modalLedgerIndex').value);
            let date = document.getElementById('modalDate').value;
            let amount = parseFloat(document.getElementById('modalAmount').value);
            let desc = document.getElementById('modalDesc').value || (type === 'charge' ? 'Charge' : 'Payment');

            if (!amount || amount <= 0) {
                alert("Please enter a valid amount.");
                return;
            }

            let player = roster.find(p => p.id === id);
            if (player) {
                if (!player.ledger) player.ledger = [];
                
                if (index >= 0) {
                    player.ledger[index] = { type: type, date: date, amount: amount, desc: desc };
                } else {
                    player.ledger.unshift({ type: type, date: date, amount: amount, desc: desc });
                }

                saveRoster();
                syncToGoogleSheets('logTransaction', { playerName: player.name, date: date, type: type, amount: amount, desc: desc });
                renderRoster();
                closeModal();
                let cardEl = document.getElementById(`card-${id}`);
                if (cardEl) cardEl.classList.add('flipped');
            }
        }

        function addNewPlayer() {
            let name = prompt("Enter Player Name:");
            if (!name || !name.trim()) return;

            let team = prompt("Enter Team Division (16U, 18U, Hybrid):", "16U Division") || "16U Division";
            let age = prompt("Enter Player Age:", "16 Yrs") || "16 Yrs";
            let pos = prompt("Enter Primary Position:", "Shortstop") || "Shortstop";
            let email = prompt("Enter Parent Email:", "parent@example.com") || "parent@example.com";

            let newId = Date.now();
            let newPlayer = { id: newId, name: name.trim(), team: team, age: age, pos: pos, email: email, active: true, ledger: [] };
            roster.push(newPlayer);
            saveRoster();
            syncToGoogleSheets('savePlayer', { player: newPlayer });
            renderRoster();
        }

        function editPlayer(id) {
            let player = roster.find(p => p.id === id);
            if (!player) return;

            player.name = prompt("Edit Player Name:", player.name) || player.name;
            player.team = prompt("Edit Team Division:", player.team) || player.team;
            player.age = prompt("Edit Age:", player.age) || player.age;
            player.pos = prompt("Edit Position:", player.pos) || player.pos;
            player.email = prompt("Edit Parent Email:", player.email) || player.email;

            saveRoster();
            syncToGoogleSheets('savePlayer', { player: player });
            renderRoster();
            let cardEl = document.getElementById(`card-${id}`);
            if (cardEl) cardEl.classList.add('flipped');
        }

        function duplicatePlayer(id) {
            let player = roster.find(p => p.id === id);
            if (!player) return;

            let clone = JSON.parse(JSON.stringify(player));
            clone.id = Date.now();
            clone.name = `${player.name} (Copy)`;
            roster.push(clone);
            saveRoster();
            syncToGoogleSheets('savePlayer', { player: clone });
            renderRoster();
        }

        function deletePlayer(id) {
            if (confirm("Are you sure you want to permanently delete this player card?")) {
                roster = roster.filter(p => p.id !== id);
                saveRoster();
                renderRoster();
            }
        }

        function quickEmail(email, playerName, balance) {
            let zelleEmail = "coachmatty@redrockbaseball.com";
            let subject = encodeURIComponent(`Red Rock Baseball - Payment Request for ${playerName}`);
            let body = encodeURIComponent(`Hi,\n\nThis is a payment request for Red Rock Baseball Club.\n\nPlayer: ${playerName}\nCurrent Balance Due: $${balance > 0 ? balance : 0}\n\nPlease submit payment via Zelle to:\nZelle Account: ${zelleEmail}\nMemo Line: ${playerName} - Dues\n\nThank you,\nCoach Matty`);
            window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
        }

        function changeAdminPassword() {
            let currentKey = localStorage.getItem('coachesHubPassword') || "redrock2026";
            let verification = prompt("Enter Current Password:");

            if (verification === currentKey) {
                let newKey = prompt("Enter NEW Admin Password:");
                if (newKey && newKey.trim().length > 3) {
                    localStorage.setItem('coachesHubPassword', newKey.trim());
                    alert(`✅ SUCCESS: Password updated! Your new password is: ${newKey.trim()}`);
                } else {
                    alert("❌ Invalid password. Must be at least 4 characters.");
                }
            } else {
                alert("❌ Incorrect current password.");
            }
        }

        // Initialize display
        renderRoster();
    </script>
</body>
</html>
