<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Rock Baseball Club | Official Site</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Impact&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0a0c;
            --bg-module: #121216;
            --red-accent: #d3122a;
            --red-glow: rgba(211, 18, 42, 0.4);
            --text-light: #ffffff;
            --text-muted: #9a9ab0;
            --border-thin: 1px solid #23232c;
            --radius-module: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        header {
            background-color: var(--bg-module);
            border-bottom: var(--border-thin);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-title {
            font-family: 'Impact', sans-serif;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-light);
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 1.5rem;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }

        nav a:hover, nav a.active {
            color: var(--red-accent);
        }

        .nav-admin-link {
            border: 1px solid var(--red-accent);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            color: var(--red-accent) !important;
        }

        .nav-admin-link:hover {
            background-color: var(--red-accent);
            color: #fff !important;
        }

        .hero {
            padding: 5rem 2rem;
            text-align: center;
            background: linear-gradient(180deg, rgba(211,18,42,0.1) 0%, rgba(10,10,12,1) 100%);
        }

        .hero h1 {
            font-family: 'Impact', sans-serif;
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        .hero p {
            max-width: 600px;
            margin: 0 auto 2rem auto;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        footer {
            border-top: var(--border-thin);
            padding: 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 4rem;
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
        }

        footer a:hover {
            color: var(--red-accent);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">Red Rock Baseball Club</div>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="coaches.html">Staff & Philosophy</a>
            <a href="admin.2.html" class="nav-admin-link">Coaches Hub 🔒</a>
        </nav>
    </header>

    <div class="hero">
        <h1>Developing Tomorrow's Ballplayers</h1>
        <p>Empowering young athletes through elite development, competition, and relentless work ethic.</p>
        <a href="coaches.html" style="background-color: var(--red-accent); color: #fff; padding: 0.8rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: 800; text-transform: uppercase;">Staff & Philosophy</a>
    </div>

    <footer>
        <p>&copy; 2026 <strong>Red Rock Baseball Club</strong>. All Rights Reserved.</p>
        <p style="margin-top: 0.5rem; font-size: 0.75rem;">
            <a href="admin.2.html">Manager Portal Access</a>
        </p>
    </footer>

</body>
</html>
